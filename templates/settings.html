{% extends "base.html" %}
{% block title %}Settings — DispatchIQ{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold text-white mb-6">Settings</h1>

  <form method="POST" action="{{ url_for('settings.save') }}" class="space-y-6">

    <div class="bg-gray-900 border border-gray-800 rounded-lg p-6 space-y-4">
      <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wide">Company Details</h2>
      <div>
        <label class="block text-sm text-gray-300 mb-1">Company Name</label>
        <input type="text" name="company_name" value="{{ settings.get('company_name', '') }}"
               placeholder="e.g. DispatchIQ Logistics"
               class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">Address</label>
        <textarea name="company_address" rows="2"
                  placeholder="Full business address"
                  class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded px-3 py-2 focus:outline-none focus:border-blue-500 resize-none">{{ settings.get('company_address', '') }}</textarea>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-gray-300 mb-1">Phone</label>
          <input type="text" name="company_phone" value="{{ settings.get('company_phone', '') }}"
                 placeholder="e.g. 9876543210"
                 class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-sm text-gray-300 mb-1">GST Number</label>
          <input type="text" name="company_gst" value="{{ settings.get('company_gst', '') }}"
                 placeholder="e.g. 27AABCU9603R1ZX"
                 class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded px-3 py-2 focus:outline-none focus:border-blue-500 uppercase">
        </div>
      </div>
    </div>

    <div class="bg-gray-900 border border-gray-800 rounded-lg p-6 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wide">WhatsApp Notifications</h2>
        {% if wa_connected %}
          <span class="flex items-center gap-1.5 text-green-400 text-sm font-medium">
            <span class="w-2 h-2 rounded-full bg-green-500"></span> Connected
          </span>
        {% else %}
          <div class="flex items-center gap-3">
            <span class="flex items-center gap-1.5 text-red-400 text-sm">
              <span class="w-2 h-2 rounded-full bg-red-500"></span> Not Connected
            </span>
            <a href="http://localhost:3001" target="_blank"
               class="text-xs bg-green-700 hover:bg-green-600 text-white px-3 py-1 rounded transition">
              Connect WhatsApp
            </a>
          </div>
        {% endif %}
      </div>
      <div class="flex items-center gap-3">
        <input type="checkbox" name="whatsapp_enabled" id="whatsapp_enabled" value="true"
               {% if settings.get('whatsapp_enabled') == 'true' %}checked{% endif %}
               class="w-4 h-4 bg-gray-800 border-gray-600 rounded">
        <label for="whatsapp_enabled" class="text-sm text-gray-300">Enable WhatsApp notifications for trip status changes</label>
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">Owner/Manager Phone for Alerts</label>
        <input type="text" name="whatsapp_owner_phone" value="{{ settings.get('whatsapp_owner_phone', '') }}"
               placeholder="e.g. 919876543210 (country code + number, no + sign)"
               class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">Daily Summary Time</label>
        <input type="time" name="daily_summary_time" value="{{ settings.get('daily_summary_time', '08:00') }}"
               class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
      </div>
    </div>

    <div class="bg-gray-900 border border-gray-800 rounded-lg p-6 space-y-4">
      <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wide">Bank Details (for Invoices)</h2>
      <div>
        <label class="block text-sm text-gray-300 mb-1">Bank Name</label>
        <input type="text" name="bank_name" value="{{ settings.get('bank_name', '') }}"
               placeholder="e.g. State Bank of India"
               class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-gray-300 mb-1">Account Number</label>
          <input type="text" name="bank_account" value="{{ settings.get('bank_account', '') }}"
                 placeholder="e.g. 12345678901"
                 class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-sm text-gray-300 mb-1">IFSC Code</label>
          <input type="text" name="bank_ifsc" value="{{ settings.get('bank_ifsc', '') }}"
                 placeholder="e.g. SBIN0001234"
                 class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded px-3 py-2 focus:outline-none focus:border-blue-500 uppercase">
        </div>
      </div>
    </div>

    <div class="bg-gray-900 border border-gray-800 rounded-lg p-6 space-y-4">
      <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wide">Integrations</h2>
      <div>
        <label class="block text-sm text-gray-300 mb-1">Traccar Server URL</label>
        <input type="url" name="traccar_url" value="{{ settings.get('traccar_url', '') }}"
               placeholder="e.g. http://traccar.example.com:8082"
               class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
      </div>
      <div class="flex items-center gap-3">
        <input type="checkbox" name="traccar_enabled" id="traccar_enabled" value="1"
               {% if settings.get('traccar_enabled') == '1' %}checked{% endif %}
               class="w-4 h-4 bg-gray-800 border-gray-600 rounded">
        <label for="traccar_enabled" class="text-sm text-gray-300">Enable Traccar GPS tracking</label>
      </div>
    </div>

    <div class="flex justify-end">
      <button type="submit"
              class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-6 py-2 rounded transition">
        Save Settings
      </button>
    </div>
  </form>
</div>
{% endblock %}
