{% extends "base.html" %}
{% block title %}Edit Client — DispatchIQ{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
  <div class="flex items-center gap-3 mb-6">
    <a href="{{ url_for('clients.list_clients') }}" class="text-gray-400 hover:text-white text-sm">← Clients</a>
    <h1 class="text-2xl font-bold text-white">Edit Client</h1>
  </div>

  <form method="POST" action="{{ url_for('clients.edit', client_id=client.id) }}">
    <div class="bg-gray-900 border border-gray-800 rounded-lg p-6 space-y-4">
      <div>
        <label class="block text-sm text-gray-300 mb-1">Company / Name <span class="text-red-400">*</span></label>
        <input type="text" name="name" required value="{{ client.name }}"
               class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">Phone <span class="text-red-400">*</span></label>
        <input type="tel" name="phone" required value="{{ client.phone }}"
               class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">Email</label>
        <input type="email" name="email" value="{{ client.email or '' }}"
               class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">Address</label>
        <textarea name="address" rows="2"
                  class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded px-3 py-2 focus:outline-none focus:border-blue-500 resize-none">{{ client.address or '' }}</textarea>
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">GST Number</label>
        <input type="text" name="gst_number" value="{{ client.gst_number or '' }}"
               class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded px-3 py-2 focus:outline-none focus:border-blue-500 uppercase">
      </div>
    </div>

    <div class="mt-5 flex justify-end gap-3">
      <a href="{{ url_for('clients.list_clients') }}"
         class="px-4 py-2 text-sm text-gray-400 hover:text-white transition">Cancel</a>
      <button type="submit"
              class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-6 py-2 rounded transition">
        Save Changes
      </button>
    </div>
  </form>
</div>
{% endblock %}
