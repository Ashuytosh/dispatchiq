{% extends "base.html" %}
{% block title %}Add Client — DispatchIQ{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
  <div class="flex items-center gap-3 mb-6">
    <a href="{{ url_for('clients.list_clients') }}" class="text-gray-400 hover:text-white text-sm">← Clients</a>
    <h1 class="text-2xl font-bold text-white">Add Client</h1>
  </div>

  <form method="POST" action="{{ url_for('clients.create') }}">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 space-y-4">
      <div>
        <label class="block text-sm text-gray-300 mb-1">Company / Name <span class="text-red-400">*</span></label>
        <input type="text" name="name" required placeholder="e.g. Sharma Traders Pvt Ltd"
               class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent">
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">Phone <span class="text-red-400">*</span></label>
        <input type="tel" name="phone" required placeholder="e.g. 9876543210"
               class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent">
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">Email</label>
        <input type="email" name="email" placeholder="e.g. contact@example.com"
               class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent">
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">Address</label>
        <textarea name="address" rows="2" placeholder="Full address"
                  class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent resize-none"></textarea>
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">GST Number</label>
        <input type="text" name="gst_number" placeholder="e.g. 27AABCU9603R1ZX"
               class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent uppercase">
      </div>
    </div>

    <div class="mt-5 flex justify-end gap-3">
      <a href="{{ url_for('clients.list_clients') }}"
         class="px-4 py-2 text-sm text-gray-400 hover:text-white transition">Cancel</a>
      <button type="submit"
              class="bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-gray-950 text-sm font-medium px-6 py-2 rounded-xl transition">
        Add Client
      </button>
    </div>
  </form>
</div>
{% endblock %}
