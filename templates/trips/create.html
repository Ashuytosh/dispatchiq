{% extends "base.html" %}
{% block title %}New Trip — DispatchIQ{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="flex items-center gap-3 mb-6">
    <a href="{{ url_for('trips.list_trips') }}" class="text-gray-400 hover:text-white text-sm">← Trips</a>
    <h1 class="text-2xl font-bold text-white">New Trip</h1>
  </div>

  <form method="POST" action="{{ url_for('trips.create') }}" class="space-y-5">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 space-y-4">
      <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wide">Trip Details</h2>

      <div>
        <label class="block text-sm text-gray-300 mb-1">Client <span class="text-red-400">*</span></label>
        <select name="client_id" required
                class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent">
          <option value="">Select client…</option>
          {% for client in clients %}
            <option value="{{ client.id }}">{{ client.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-gray-300 mb-1">From Location <span class="text-red-400">*</span></label>
          <input type="text" name="from_location" required placeholder="e.g. Mumbai"
                 class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent">
        </div>
        <div>
          <label class="block text-sm text-gray-300 mb-1">To Location <span class="text-red-400">*</span></label>
          <input type="text" name="to_location" required placeholder="e.g. Delhi"
                 class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent">
        </div>
      </div>

      <div>
        <label class="block text-sm text-gray-300 mb-1">Goods Description</label>
        <input type="text" name="goods_description" placeholder="e.g. Electronics, Auto parts"
               class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-gray-300 mb-1">Weight (Tons)</label>
          <input type="number" name="weight_tons" step="0.1" min="0" placeholder="0.0"
                 class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent">
        </div>
        <div>
          <label class="block text-sm text-gray-300 mb-1">No. of Packages</label>
          <input type="number" name="num_packages" min="0" placeholder="0"
                 class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent">
        </div>
      </div>
    </div>

    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 space-y-4">
      <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wide">Payment</h2>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-gray-300 mb-1">Freight Amount (₹) <span class="text-red-400">*</span></label>
          <input type="number" name="freight_amount" id="freight_amount" required min="0" step="0.01" placeholder="0"
                 class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent"
                 oninput="calcBalance()">
        </div>
        <div>
          <label class="block text-sm text-gray-300 mb-1">Advance Paid (₹)</label>
          <input type="number" name="advance_paid" id="advance_paid" min="0" step="0.01" placeholder="0"
                 class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent"
                 oninput="calcBalance()">
        </div>
      </div>

      <div class="bg-gray-800 rounded px-4 py-3 flex justify-between items-center">
        <span class="text-sm text-gray-400">Balance Due</span>
        <span id="balance_display" class="text-lg font-bold text-white">₹0</span>
      </div>
    </div>

    <div class="flex justify-end gap-3">
      <a href="{{ url_for('trips.list_trips') }}"
         class="px-4 py-2 text-sm text-gray-400 hover:text-white transition">Cancel</a>
      <button type="submit"
              class="bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-gray-950 text-sm font-medium px-6 py-2 rounded-xl transition">
        Create Trip
      </button>
    </div>
  </form>
</div>

<script>
function calcBalance() {
  const freight = parseFloat(document.getElementById('freight_amount').value) || 0;
  const advance = parseFloat(document.getElementById('advance_paid').value) || 0;
  const balance = freight - advance;
  document.getElementById('balance_display').textContent = '₹' + balance.toLocaleString('en-IN', {maximumFractionDigits: 0});
}
</script>
{% endblock %}
