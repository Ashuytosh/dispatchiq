{% extends 'base.html' %}
{% block title %}Add User — DispatchIQ{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
  <div class="flex items-center gap-3 mb-6">
    <a href="/admin/users" class="text-gray-400 hover:text-gray-200 transition">← Back</a>
    <h1 class="text-xl font-bold text-gray-100">Add User</h1>
  </div>

  <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
    <form method="POST" action="/admin/users/add" class="space-y-4">

      <div>
        <label class="block text-xs text-gray-400 mb-1">Full Name</label>
        <input type="text" name="full_name" required value="{{ form.get('full_name', '') }}"
               class="w-full bg-gray-800 border border-gray-700 text-gray-100 rounded-xl px-3 py-2 text-sm
                      focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent">
      </div>

      <div>
        <label class="block text-xs text-gray-400 mb-1">Email</label>
        <input type="email" name="email" required value="{{ form.get('email', '') }}"
               class="w-full bg-gray-800 border border-gray-700 text-gray-100 rounded-xl px-3 py-2 text-sm
                      focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent">
      </div>

      <div>
        <label class="block text-xs text-gray-400 mb-1">Username</label>
        <input type="text" name="username" required value="{{ form.get('username', '') }}"
               class="w-full bg-gray-800 border border-gray-700 text-gray-100 rounded-xl px-3 py-2 text-sm
                      focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent">
      </div>

      <div>
        <label class="block text-xs text-gray-400 mb-1">Temporary Password</label>
        <input type="text" name="password" required
               class="w-full bg-gray-800 border border-gray-700 text-gray-100 rounded-xl px-3 py-2 text-sm
                      focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent">
        <p class="text-xs text-gray-500 mt-1">User can change it after first login.</p>
      </div>

      <div>
        <label class="block text-xs text-gray-400 mb-1">Role</label>
        <select name="role"
                class="w-full bg-gray-800 border border-gray-700 text-gray-100 rounded-xl px-3 py-2 text-sm
                       focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent">
          <option value="dispatcher">Dispatcher</option>
          <option value="viewer">Viewer</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <div class="flex gap-3 pt-2">
        <button type="submit"
                class="bg-amber-500 hover:bg-amber-600 text-gray-950 font-semibold px-5 py-2 rounded-xl text-sm transition">
          Create User
        </button>
        <a href="/admin/users"
           class="bg-gray-800 hover:bg-gray-700 text-gray-300 font-medium px-5 py-2 rounded-xl text-sm transition">
          Cancel
        </a>
      </div>

    </form>
  </div>
</div>
{% endblock %}
