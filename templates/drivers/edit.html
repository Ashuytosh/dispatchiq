{% extends "base.html" %}
{% block title %}Edit Driver — DispatchIQ{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
  <div class="flex items-center gap-3 mb-6">
    <a href="{{ url_for('drivers.list_drivers') }}" class="text-gray-400 hover:text-white text-sm">← Drivers</a>
    <h1 class="text-2xl font-bold text-white">Edit Driver</h1>
  </div>

  <form method="POST" action="{{ url_for('drivers.edit', driver_id=driver.id) }}">
    <div class="bg-gray-900 border border-gray-800 rounded-lg p-6 space-y-4">
      <div>
        <label class="block text-sm text-gray-300 mb-1">Full Name <span class="text-red-400">*</span></label>
        <input type="text" name="name" required value="{{ driver.name }}"
               class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">Phone <span class="text-red-400">*</span></label>
        <input type="tel" name="phone" required value="{{ driver.phone }}"
               class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">License Number <span class="text-red-400">*</span></label>
        <input type="text" name="license_number" required value="{{ driver.license_number }}"
               class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded px-3 py-2 focus:outline-none focus:border-blue-500 uppercase">
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">Assigned Vehicle</label>
        <select name="assigned_vehicle_id"
                class="w-full bg-gray-800 border border-gray-700 text-gray-200 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
          <option value="">None</option>
          {% for v in vehicles %}
            <option value="{{ v.id }}" {% if driver.assigned_vehicle_id == v.id %}selected{% endif %}>
              {{ v.plate_number }} ({{ v.vehicle_type }}, {{ v.capacity_tons }}T)
            </option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="mt-5 flex justify-end gap-3">
      <a href="{{ url_for('drivers.list_drivers') }}"
         class="px-4 py-2 text-sm text-gray-400 hover:text-white transition">Cancel</a>
      <button type="submit"
              class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-6 py-2 rounded transition">
        Save Changes
      </button>
    </div>
  </form>
</div>
{% endblock %}
